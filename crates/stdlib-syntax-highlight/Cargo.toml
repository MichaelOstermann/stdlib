[package]
name = "stdlib-syntax-highlight"
version = "0.0.0"
edition = "2024"
description = "The tokenizer of @monstermann/stdlib-syntax-highlight, Irosashi compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
irosashi = { version = "0.3", default-features = false }
serde_json = "1"
